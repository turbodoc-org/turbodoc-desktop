# Builds, tests and packages Turbodoc on macOS, Windows and Linux.
#
# - Every push and pull request: tests and packages on all three, and keeps the installers as
#   the run's artifacts for a week.
# - A tag like v0.2.0: the same, then a draft GitHub release with every installer attached.
#   Check it and press Publish.
#
# Signing uses secrets in the "release" environment (Settings → Environments), which only
# v* tags may use: pushes to branches and pull requests never see them. Each platform turns on
# by itself once its secrets are there; scripts/set-apple-secrets.sh stores Apple's.
#   macOS    APPLE_CERTIFICATE (base64 of the Developer ID Application .p12),
#            APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY ("Developer ID Application: …"),
#            and for notarization APPLE_API_ISSUER, APPLE_API_KEY (the key id) and
#            APPLE_API_KEY_P8 (the .p8 file's contents, from App Store Connect).
#   Windows  AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, and the variables
#            ARTIFACT_SIGNING_ENDPOINT, ARTIFACT_SIGNING_ACCOUNT and ARTIFACT_SIGNING_PROFILE
#            (Azure Artifact Signing, formerly Trusted Signing).
# Without them the builds still succeed: macOS signs ad hoc and Windows is unsigned.
#
# Every action is pinned to a commit, since a tag can be moved to other code and these steps
# run beside the signing keys. Update them deliberately, comment and hash together.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the job that drafts the release may write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The signing secrets, for v* tags only. Elsewhere no environment, and no secrets.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest, targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
          - { name: Windows, os: windows-latest, targets: "" }
          # The oldest supported Ubuntu: the AppImage runs on distros at least as new as its glibc.
          - { name: Linux, os: ubuntu-22.04, targets: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.targets }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A new key starts a new cache. "packager-source": the caches before it held a
          # cargo-packager downloaded from QuickInstall, which `cargo install` would keep.
          key: packager-source
          # Release builds read main's cache but never write one.
          save-if: ${{ !startsWith(github.ref, 'refs/tags/') }}

      # Built from its source on crates.io, at a fixed version: it runs beside the signing
      # secrets, so no prebuilt binary from a third party. rust-cache keeps ~/.cargo/bin, so
      # this compiles once and later runs find it installed.
      - name: Install cargo-packager
        run: cargo install cargo-packager --version 0.11.8 --locked

      - name: Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libfuse2

      - name: Test
        run: cargo test --locked

      - name: Build
        run: scripts/package.sh --build-only

      - name: Sign the Windows binary
        if: runner.os == 'Windows' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\target\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Notarization key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          # notarytool reads the key from a file. Without the secret, the app isn't notarized.
          if [[ -n "$APPLE_API_KEY_P8" ]]; then
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notarize.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notarize.p8" >> "$GITHUB_ENV"
          fi

      - name: Package
        env:
          # Linux: run linuxdeploy without mounting it (no FUSE needed in the container).
          APPIMAGE_EXTRACT_AND_RUN: "1"
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: scripts/package.sh --package-only

      # The packager notarizes and staples the app; the .dmg around it needs its own ticket,
      # or Gatekeeper still stops the download ("Apple could not verify …").
      - name: Notarize the disk image
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          for dmg in dist/*.dmg; do
            xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait --timeout 30m
            xcrun stapler staple "$dmg"
          done

      # What a downloaded copy meets: a Developer ID signature and a stapled ticket. A tag with
      # signing set up fails here rather than release something Gatekeeper would block.
      - name: Check the macOS signature
        if: runner.os == 'macOS' && env.APPLE_API_KEY_PATH != ''
        run: |
          codesign --verify --deep --strict --verbose=2 dist/Turbodoc.app
          xcrun stapler validate dist/Turbodoc.app
          for dmg in dist/*.dmg; do
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done
          spctl --assess --type execute --verbose=2 dist/Turbodoc.app

      - name: Unsigned macOS release
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v') && env.APPLE_API_KEY_PATH == ''
        run: echo "::warning::This release's macOS build is signed ad hoc and not notarized; Gatekeeper will block downloads. See scripts/set-apple-secrets.sh."

      - name: Sign the Windows installers
        if: runner.os == 'Windows' && vars.ARTIFACT_SIGNING_ACCOUNT != ''
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: turbodoc-${{ runner.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/*.dmg
            dist/*.msi
            dist/*-setup.exe
            dist/*.deb
            dist/*.AppImage

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
